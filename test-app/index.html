<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test App - Backend Connection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .button-group {
      margin-bottom: 30px;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .response-section {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid #f0f0f0;
    }

    .response-label {
      color: #666;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .response-box {
      background: #f5f5f5;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      color: #333;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-all;
      line-height: 1.6;
    }

    .response-box.success {
      background: #e8f5e9;
      border-color: #4caf50;
      color: #2e7d32;
    }

    .response-box.error {
      background: #ffebee;
      border-color: #f44336;
      color: #c62828;
    }

    .response-box.loading {
      background: #e3f2fd;
      border-color: #2196f3;
      color: #1565c0;
      font-style: italic;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }

    .status-indicator.success {
      background: #4caf50;
    }

    .status-indicator.error {
      background: #f44336;
    }

    .status-indicator.loading {
      background: #2196f3;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Full-Stack Test</h1>
    <p class="subtitle">Test backend connection and app generation</p>

    <div class="button-group">
      <button id="checkButton" onclick="checkBackend()">Check Backend</button>
    </div>

    <div class="response-section">
      <div class="response-label">Response:</div>
      <div class="response-box" id="responseBox">
        Click the button to test the connection
      </div>
    </div>
  </div>

  <script>
    const responseBox = document.getElementById('responseBox');
    const checkButton = document.getElementById('checkButton');

    async function checkBackend() {
      // Disable button and show loading state
      checkButton.disabled = true;
      responseBox.className = 'response-box loading';
      responseBox.innerHTML = '<span class="status-indicator loading"></span>Connecting to backend...';

      try {
        // Call the backend API
        const response = await fetch('/api/test', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
          },
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        const message = data.message || data;

        // Display success response
        responseBox.className = 'response-box success';
        responseBox.innerHTML = `<span class="status-indicator success"></span>${message}`;
        checkButton.disabled = false;
      } catch (error) {
        // Display error response
        responseBox.className = 'response-box error';
        responseBox.innerHTML = `<span class="status-indicator error"></span>Error: ${error.message}. Make sure the backend server is running on port 5000.`;
        checkButton.disabled = false;
      }
    }

    // Optional: Check backend on page load
    window.addEventListener('load', () => {
      console.log('Test app loaded. Frontend ready.');
      console.log('Click "Check Backend" button to test the connection.');
    });
  </script>
</body>
</html>
