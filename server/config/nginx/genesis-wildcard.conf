# Wildcard routing for deployed Genesis apps
# Place in /etc/nginx/sites-available/genesis-wildcard.conf and symlink into sites-enabled.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream genesis_api {
  server 127.0.0.1:5000;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  server_name *.genesisapp.in genesisapp.in;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name *.genesisapp.in genesisapp.in;

  # Use a wildcard cert from certbot/acme dns challenge.
  ssl_certificate /etc/letsencrypt/live/genesisapp.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/genesisapp.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:20m;
  ssl_session_timeout 1d;

  client_max_body_size 25m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass http://genesis_api;
  }
}
